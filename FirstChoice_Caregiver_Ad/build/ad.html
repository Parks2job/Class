<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--blue:#139FDD;--pink:#E5188E;--ink:#1B2833;--muted:#4A5866}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ddd;font-family:'Inter',sans-serif;color:var(--ink)}
  .ad{position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .feed{width:1080px;height:1350px}
  .story{width:1080px;height:1920px}

  .photo{position:relative;flex:none;background:url(photo_enhanced.jpg) no-repeat;background-size:cover}
  .photo:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--pink) 50% 100%)}
  .logocard{position:absolute;left:64px;bottom:-78px;background:#fff;border-radius:26px;padding:20px 30px;box-shadow:0 14px 34px rgba(16,40,60,.20);z-index:2}
  .logocard img{display:block}

  .body{position:relative;flex:1;padding:0 72px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.12em;color:var(--pink);text-transform:uppercase}
  .eyebrow:before{content:"";width:44px;height:5px;border-radius:3px;background:var(--pink)}
  h1{font-family:'Inter Display','Inter',sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
  .sub{color:var(--muted);font-weight:500;line-height:1.3}
  .row{display:flex;align-items:center;justify-content:space-between;gap:30px}
  .pay{display:flex;align-items:flex-end;gap:14px}
  .amt{font-family:'Inter Display','Inter',sans-serif;font-weight:900;line-height:.86;letter-spacing:-.01em;color:var(--blue)}
  .amt sup{font-size:.5em;vertical-align:.62em;margin-right:4px;letter-spacing:0}
  .amt .dot{margin:0 .07em 0 .05em}
  .per{font-family:'Inter Display','Inter',sans-serif;font-weight:800;color:var(--pink)}
  ul{list-style:none;display:grid}
  li{display:flex;align-items:center;gap:16px;font-weight:600;color:var(--ink)}
  li i{flex:none;border-radius:50%;background:var(--pink);display:grid;place-items:center}
  li i svg{width:60%;height:60%}

  .band{flex:none;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:30px}
  .band .site{font-weight:700}
  .band .note{font-weight:500;opacity:.92;margin-top:6px}
  .btn{flex:none;background:var(--pink);color:#fff;font-weight:800;border-radius:999px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 rgba(0,0,0,.12)}
  .btn svg{width:.85em;height:.85em}

  /* ---------- feed 1080x1350 ---------- */
  .feed .photo{height:520px;background-position:center 28%}
  .feed .logocard img{height:104px}
  .feed .body{padding-top:96px;padding-bottom:28px}
  .feed .eyebrow{font-size:25px}
  .feed h1{font-size:76px;margin-top:16px;max-width:760px}
  .feed .sub{font-size:31px;margin-top:14px}
  .feed .row{margin-top:26px;align-items:flex-end}
  .feed .amt{font-size:150px}
  .feed .per{font-size:46px;padding-bottom:10px}
  .feed ul{gap:16px;padding-bottom:6px}
  .feed li{font-size:29px;white-space:nowrap}
  .feed li i{width:40px;height:40px}
  .feed .band{padding:30px 72px 30px}
  .feed .band .site{font-size:31px}
  .feed .band .note{font-size:21px}
  .feed .btn{font-size:38px;padding:22px 40px}

  /* ---------- story 1080x1920 (keep top ~220px / bottom ~260px free of key content) ---------- */
  .story .photo{height:720px;background-position:38% 30%}
  .story .logocard{bottom:-86px}
  .story .logocard img{height:118px}
  .story .body{padding-top:118px;padding-bottom:20px;justify-content:flex-start}
  .story .eyebrow{font-size:28px}
  .story h1{font-size:96px;margin-top:20px}
  .story .sub{font-size:38px;margin-top:20px}
  .story .row{margin-top:34px;flex-direction:column;align-items:flex-start;gap:34px}
  .story .amt{font-size:200px}
  .story .per{font-size:60px;padding-bottom:14px}
  .story ul{gap:20px}
  .story li{font-size:38px}
  .story li i{width:48px;height:48px}
  .story .band{padding:40px 72px 250px}
  .story .band .site{font-size:32px}
  .story .band .note{font-size:22px}
  .story .btn{font-size:42px;padding:26px 46px}
</style>
</head>
<body>
<template id="content">
  <div class="photo">
    <div class="logocard"><img src="logo.png" alt="First Choice Staffing Agency"></div>
  </div>
  <div class="body">
    <div class="eyebrow">Michigan Home Help Program</div>
    <h1>Caring for a loved one at home?</h1>
    <p class="sub">If they have Michigan Medicaid, you may be able to get paid for the care you already give.</p>
    <div class="row">
      <div class="pay">
        <div class="amt"><sup>$</sup>17<span class="dot">.</span>13</div>
        <div class="per">/hour</div>
      </div>
      <ul>
        <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Care for a loved one</li>
        <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Medicaid Home Help</li>
        <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Apply in 2 minutes</li>
      </ul>
    </div>
  </div>
  <div class="band">
    <div>
      <div class="site">firstchoicestaffinghcmi.com</div>
      <div class="note">Eligibility requirements apply.</div>
    </div>
    <div class="btn">Apply Now <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
</template>

<div id="feed" class="ad feed"></div>
<div style="height:40px"></div>
<div id="story" class="ad story"></div>

<script>
  const t=document.getElementById('content');
  for(const id of ['feed','story']) document.getElementById(id).appendChild(t.content.cloneNode(true));
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --blue:#139FDD; --blue-dark:#0B6FA0; --pink:#E5188E; --ink:#1B2833; --muted:#4A5866; --tint:#EEF8FD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ddd;font-family:'Inter',sans-serif;color:var(--ink)}
  .ad{position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .feed{width:1080px;height:1350px}
  .story{width:1080px;height:1920px}

  /* soft brand shapes */
  .wash{position:absolute;border-radius:50%;filter:blur(2px)}
  .wash.b{background:var(--tint)}
  .wash.p{background:#FDEEF6}
  .heart{position:absolute;opacity:.13}

  .top{position:relative;padding:64px 72px 0}
  .logo{height:150px;display:block}
  .body{position:relative;padding:0 72px;flex:1;display:flex;flex-direction:column}
  .eyebrow{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:27px;letter-spacing:.12em;color:var(--pink);text-transform:uppercase}
  .eyebrow:before{content:"";width:44px;height:5px;border-radius:3px;background:var(--pink)}
  h1{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:96px;line-height:1.0;letter-spacing:-.02em;margin-top:26px;color:var(--ink)}
  .sub{font-size:36px;line-height:1.35;color:var(--muted);margin-top:26px;max-width:860px;font-weight:500}
  .pay{display:flex;align-items:flex-end;gap:22px;margin-top:34px}
  .pay .lead{font-weight:700;font-size:32px;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;line-height:1.15;padding-bottom:34px}
  .amt{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:200px;line-height:.86;letter-spacing:-.01em;color:var(--blue)}
  .amt sup{font-size:.5em;vertical-align:.62em;margin-right:4px;letter-spacing:0}
  .amt .dot{margin:0 .07em 0 .05em}
  .per{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:58px;color:var(--pink);padding-bottom:16px}
  ul{list-style:none;margin-top:44px;display:grid;gap:20px}
  li{display:flex;align-items:center;gap:22px;font-size:37px;font-weight:600;color:var(--ink)}
  li i{flex:none;width:50px;height:50px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
  li i svg{width:28px;height:28px}

  .band{position:relative;background:var(--blue);color:#fff;padding:40px 72px 34px;display:flex;align-items:center;justify-content:space-between;gap:30px}
  .band .site{font-size:34px;font-weight:700;letter-spacing:.01em}
  .band .note{font-size:22px;font-weight:500;opacity:.92;margin-top:8px}
  .btn{flex:none;background:var(--pink);color:#fff;font-weight:800;font-size:40px;padding:26px 46px;border-radius:999px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
  .btn svg{width:34px;height:34px}

  /* story tweaks: keep top ~220px and bottom ~280px clear of app UI */
  .story .top{padding-top:180px}
  .story .logo{height:170px}
  .story h1{font-size:108px;margin-top:30px}
  .story .sub{font-size:40px;margin-top:30px;max-width:950px}
  .story .pay{margin-top:44px}
  .story .amt{font-size:236px}
  .story .amt .dot{margin:0 .07em 0 .05em}
  .per{font-size:68px}
  .story ul{margin-top:52px;gap:26px}
  .story li{font-size:41px}
  .story .band{flex-direction:column;align-items:flex-start;padding:48px 72px 230px;gap:30px}
  .story .btn{font-size:48px;padding:32px 56px}
</style>
</head>
<body>
<template id="content">
  <div class="wash b" style="width:900px;height:900px;right:-380px;top:250px"></div>
  <div class="wash p" style="width:520px;height:520px;right:-200px;top:-210px"></div>
  <img class="heart" src="icon.png">
  <div class="top"><img class="logo" src="logo.png" alt="First Choice Staffing Agency"></div>
  <div class="body">
    <div style="margin-top:46px" class="eyebrow">Michigan Home Help Program</div>
    <h1>Caring for a loved one at home?</h1>
    <p class="sub">If they have Michigan Medicaid, you may be able to get paid for the care you already give.</p>
    <div class="pay">
      <div class="amt"><sup>$</sup>17<span class="dot">.</span>13</div>
      <div class="per">/hour</div>
    </div>
    <ul>
      <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Care for someone you already know</li>
      <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Michigan Medicaid Home Help</li>
      <li><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Sign up in 2 minutes from your phone</li>
    </ul>
  </div>
  <div class="band">
    <div>
      <div class="site">firstchoicestaffinghcmi.com</div>
      <div class="note">Eligibility requirements apply.</div>
    </div>
    <div class="btn">Apply Now <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
</template>

<div id="feed" class="ad feed"></div>
<div style="height:40px"></div>
<div id="story" class="ad story"></div>

<script>
  const t=document.getElementById('content');
  for(const id of ['feed','story']){
    const el=document.getElementById(id);
    el.appendChild(t.content.cloneNode(true));
    const h=el.querySelector('.heart');
    if(id==='feed'){h.style.cssText+='width:560px;right:-120px;top:560px';}
    else{h.style.cssText+='width:640px;right:-150px;top:840px';
      el.querySelectorAll('.wash')[0].style.top='520px';}
  }
</script>
</body>
</html>
